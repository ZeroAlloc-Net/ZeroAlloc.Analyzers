name: CI

on:
  push:
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload via OIDC, no token secret

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 11.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Calculate version
        id: gitversion
        run: |
          version=$(dotnet dotnet-gitversion /output json /showvariable SemVer)
          echo "semver=$version" >> $GITHUB_OUTPUT
          echo "Calculated version: $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        # The version goes to the build, not only to pack: pack runs --no-build, so the
        # assemblies it packs carry whatever version this step stamped. Without it the
        # CI package claimed the SDK default 1.0.0. See ZeroAlloc-Net/.github#36.
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.gitversion.outputs.semver }}

      # --collect "XPlat Code Coverage" makes vstest load coverlet's in-proc collector,
      # which writes every module's hits when the test session ends. With the runsettings
      # file alone, hits are written only by ProcessExit handlers, and vstest kills a test
      # host that has not exited 100 ms after the run, so a module can read 0 at random.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFilePrefix=test-results" --collect "XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults

      # Fails when line coverage is below the floor, or when codecov.yml would let a
      # drop in coverage pass quietly. Shared from ci-baseline.
      - name: Coverage gate
        uses: MarcelRoozekrans/ci-baseline/actions/coverage-gate@v1
        with:
          reports: TestResults/**/coverage.cobertura.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage to Codecov
        if: '!cancelled()'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: "TestResults/**/coverage.cobertura.xml"
          disable_search: true   # only the files above, not every *.xml the search finds
          fail_ci_if_error: false

      - name: Pack
        run: dotnet pack src/ZeroAlloc.Analyzers.Package/ZeroAlloc.Analyzers.Package.csproj -c Release --no-build -p:Version=${{ steps.gitversion.outputs.semver }}

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: src/ZeroAlloc.Analyzers.Package/bin/Release/*.nupkg

  # The analyzers run in the consumer's compiler. An analyzer built against a newer Roslyn than
  # that compiler is skipped with CS9057 and reports nothing. This builds a net10.0 consumer of the
  # packed package with the oldest supported SDK band, 10.0.1xx, whose compiler is Roslyn 5.0, and
  # fails unless the build reports ZA0105. See ZeroAlloc-Net/.github#77.
  sdk10-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json's SDK packs the repository; the smoke folder's own global.json pins
          # 10.0.100 with rollForward latestPatch, so a newer band cannot stand in for 10.0.1xx.
          global-json-file: global.json
          dotnet-version: 10.0.1xx

      - name: Pack
        run: |
          version="9.9.9-local.sha${GITHUB_SHA::7}"
          echo "ANALYZERS_VERSION=$version" >> "$GITHUB_ENV"
          dotnet pack src/ZeroAlloc.Analyzers.Package/ZeroAlloc.Analyzers.Package.csproj -c Release -o artifacts -p:Version="$version"

      - name: Build the consumer and check the analyzer ran
        run: tests/ZeroAlloc.Analyzers.Sdk10Smoke/check.sh "$ANALYZERS_VERSION"

  # Fails when a packed DLL references Roslyn above 5.0.0, the compiler of SDK 10.0.1xx.
  roslyn-floor:
    uses: ZeroAlloc-Net/.github/.github/workflows/roslyn-floor.yml@main

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
