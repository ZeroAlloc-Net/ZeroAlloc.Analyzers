name: Trigger website rebuild

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

# The dispatch is sent with a token from the release bot GitHub App, scoped to
# ZeroAlloc-Net/.website, so GITHUB_TOKEN needs no access. The App replaced the
# WEBSITE_DISPATCH_TOKEN PAT: it does not expire and does not act as a person.
permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a release bot token for .website
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ZeroAlloc-Net
          repositories: .website
          permission-contents: write

      # .website's Update submodules workflow listens for exactly this event type.
      - name: Dispatch to .website repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ZeroAlloc-Net/.website
          event-type: submodule-update
